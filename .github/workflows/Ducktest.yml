# DRAFT — ducktest-driver-based provision/test suite for the unity_catalog extension.
#
# Modeled on the driver's proven workflow (benfleis/duckdb-pytest-driver .github/workflows/test.yml):
# thin wrapper that runs the same commands a dev runs (see that repo's AGENTS.md "Dev loop").
#
# Two tiers, mirroring the suites declared in test/conftest.py (register_suite):
#   * oss-local  — suite `oss_local` (default=True). Boots the OSS Unity Catalog docker container
#                  (test/py/uc/server.py, OSS_SERVICE) via the driver store; self-seeds the `duck`
#                  catalog from its entrypoint. A bare `uv run pytest` selects it.
#   * databricks — suite `databricks` (default=False, marker `databricks`). Live cloud; creds-gated.
#                  Selected explicitly with `-m databricks`. No docker.
#
# NOTE on the docker gate: the driver's own `--run-docker`/`-m docker` convention lives in the driver's
# SELF-tests only. This consumer instead uses the driver SUITE system — the docker tier IS the default
# suite, so it needs no flag; the creds tier is opted into with `-m databricks`. (Never `-m 'not docker'`.)
#
# Driver resolution: pyproject.toml pins `duckdb-pytest-driver = { path = "../driver" }`, so we check out
# BOTH repos side-by-side under the workspace — this consumer at `main/`, the driver at `driver/` — and run
# from `main/` so `../driver` resolves. DRIVER_REF defaults to the redesign branch; override via dispatch.

name: Ducktest functional tests

on:
  push:
    branches: [redesign-migration, main]
  pull_request:
  workflow_dispatch:
    inputs:
      driver_ref:
        description: "git ref of benfleis/duckdb-pytest-driver to test against"
        required: false
        default: redesign

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The sibling driver checkout — default the redesign branch; retarget once the redesign lands.
  DRIVER_REPO: benfleis/duckdb-pytest-driver
  DRIVER_REF: ${{ github.event.inputs.driver_ref || 'redesign' }}
  VCPKG_COMMIT_ID: 84bab45d415d22042bd0b9081aea57f362da3f35

jobs:
  # ---------------------------------------------------------------------------
  # Presence-gate for the databricks tier. secrets are NOT readable in a job-level
  # `if:`, so a tiny guard job reads them in a step expression and publishes a boolean
  # output. Forks / no-secrets → 'false' → the databricks job skips cleanly.
  # ---------------------------------------------------------------------------
  guard-databricks:
    name: Check databricks credentials present
    runs-on: ubuntu-latest
    outputs:
      has_creds: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        # `!= ''` collapses the secret to a boolean before it is ever printed — no secret is emitted.
        run: echo "has=${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # OSS-local tier: the default `oss_local` suite. Boots the OSS UC docker container
  # (the driver provisions/tears it down), then runs the .test bodies through the built
  # unittest binary with provisioning. Docker is preinstalled on ubuntu-latest.
  # ---------------------------------------------------------------------------
  oss-local:
    name: OSS-local Unity Catalog (ducktest, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # guard rail: a wedged container/seed fails here, not at the 6h job default
    defaults:
      run:
        working-directory: main
    env:
      # OSS UC container image: the stable :ci alias published by publish-uc-image.yml. server.py reads
      # DUCKTEST_UC_IMAGE (defaults to :local for dev); CI overrides it to the registry alias.
      DUCKTEST_UC_IMAGE: ghcr.io/benfleis/ducktest-unitycatalog:ci
      # --- build env, lifted from LocalTesting.yml (the proven build recipe) ------------------------
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      USE_MERGED_VCPKG_MANIFEST: 1
      BUILD_EXTENSION_TEST_DEPS: full
      # sccache caches BOTH C++ (duckdb auto-detects it) and Rust (delta-kernel via RUSTC_WRAPPER).
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      # ducktest: point the driver at the release build (build/<variant>/test/unittest + sibling duckdb CLI).
      BUILD_DIR: build/release

    steps:
      # --- side-by-side checkout so `../driver` resolves from main/pyproject.toml -------------------
      - name: Checkout unity_catalog (consumer) at main/
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0
          submodules: "true"

      - name: Checkout the ducktest driver at driver/ (sibling of main/)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DRIVER_REPO }}
          ref: ${{ env.DRIVER_REF }}
          path: driver

      # --- build (lifted from LocalTesting.yml; paths rebased under main/) --------------------------
      - name: Configure OpenSSL for Rust
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          OPENSSL_ROOT_DIR=$PWD/build/release/vcpkg_installed/x64-linux
          OPENSSL_DIR=$PWD/build/release/vcpkg_installed/x64-linux
          OPENSSL_USE_STATIC_LIBS=true
          EOF

      - name: Install Ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Resolve duckdb revision for cache key
        id: duckdb_rev
        run: echo "sha=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg built packages
        uses: actions/cache@v4
        with:
          # workspace-relative (NOT working-directory-relative): the consumer lives under main/.
          path: main/build/release/vcpkg_installed
          key: vcpkg-x64-linux-${{ env.VCPKG_COMMIT_ID }}-${{ steps.duckdb_rev.outputs.sha }}-${{ hashFiles('main/vcpkg.json', 'main/extension_config.cmake') }}
          restore-keys: |
            vcpkg-x64-linux-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-x64-linux-

      - name: Build extension
        run: |
          make release
          sccache --show-stats || true

      # --- ducktest: uv + the OSS container image + the suite run -----------------------------------
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The OSS suite boots $DUCKTEST_UC_IMAGE (test/py/uc/server.py). It's the multi-arch :ci alias published
      # by publish-uc-image.yml; warm the cache here so a missing/unpullable image fails fast and loud
      # (public package → anonymous pull works; if the package is private add a docker login step).
      - name: Pull OSS Unity Catalog image (warm cache, fail fast if unpullable)
        run: docker pull "$DUCKTEST_UC_IMAGE"

      - name: OSS-local suite (default `oss_local`; boots the UC container)
        # -n0 -s: serial + unbuffered so container/seed output streams live (xdist buffers it).
        # Bare selection == the default suite; no -m needed. uv resolves the driver from ../driver.
        run: uv run pytest -n0 -s

  # ---------------------------------------------------------------------------
  # Databricks tier: the non-default `databricks` suite (`-m databricks`). Creds-gated
  # via the guard job. No docker. Credentials mirror CloudTesting.yml (1Password service
  # account → DATABRICKS_*). Skips cleanly on forks / when the secret is absent.
  # ---------------------------------------------------------------------------
  databricks:
    name: Databricks (ducktest, creds-gated)
    needs: guard-databricks
    if: needs.guard-databricks.outputs.has_creds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: main
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      USE_MERGED_VCPKG_MANIFEST: 1
      DUCKDB_PLATFORM: linux_amd64
      BUILD_EXTENSION_TEST_DEPS: full
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      BUILD_DIR: build/release

    steps:
      - name: Checkout unity_catalog (consumer) at main/
        uses: actions/checkout@v4
        with:
          path: main
          fetch-depth: 0
          submodules: "true"

      - name: Checkout the ducktest driver at driver/ (sibling of main/)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DRIVER_REPO }}
          ref: ${{ env.DRIVER_REF }}
          path: driver

      - name: Configure OpenSSL for Rust
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          OPENSSL_ROOT_DIR=$PWD/build/release/vcpkg_installed/x64-linux
          OPENSSL_DIR=$PWD/build/release/vcpkg_installed/x64-linux
          OPENSSL_USE_STATIC_LIBS=true
          EOF

      - name: Install Ninja
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Resolve duckdb revision for cache key
        id: duckdb_rev
        run: echo "sha=$(git rev-parse HEAD:duckdb)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg built packages
        uses: actions/cache@v4
        with:
          path: main/build/release/vcpkg_installed
          key: vcpkg-x64-linux-${{ env.VCPKG_COMMIT_ID }}-${{ steps.duckdb_rev.outputs.sha }}-${{ hashFiles('main/vcpkg.json', 'main/extension_config.cmake') }}
          restore-keys: |
            vcpkg-x64-linux-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-x64-linux-

      - name: Build extension
        run: |
          make release
          sccache --show-stats || true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Credentials: same source as CloudTesting.yml — a 1Password service account fetches the live
      # Databricks token/endpoint. The driver's `databricks` credential (test/conftest.py) adopts them
      # from env. TODO(secrets): confirm secret name OP_SERVICE_ACCOUNT_TOKEN and the op:// item paths.
      - name: Load Databricks credentials
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABRICKS_TOKEN: "op://testing-rw/databricks_ccv2/token"
          DATABRICKS_ENDPOINT: "op://testing-rw/databricks_ccv2/endpoint"
          DATABRICKS_REGION: "op://testing-rw/databricks_ccv2/aws_region"

      - name: Databricks suite (`-m databricks`)
        # Non-default suite → select it explicitly. Serial + unbuffered for live provisioning output.
        run: uv run pytest -m databricks -n0 -s
