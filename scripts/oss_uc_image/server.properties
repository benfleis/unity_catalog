# Unity Catalog server config for the "duck" test image.
# Minimal on purpose: local filesystem only, no cloud credentials, no auth.

server.env=dev

# Auth off: single default principal, no tokens needed. Dev/CI only.
server.authorization=disable

# Managed tables must be enabled for the duck.managed schema's catalog-managed
# (MANAGED) tables. duck.external holds plain EXTERNAL tables.
server.managed-table.enabled=true

# No server-level storage-root.tables fallback is set on purpose. The managed
# schema (duck.managed) carries its own storage_root (.../etc/data/duck/managed),
# so its catalog-managed tables (and UC's __unitystorage tree) land under it.
# External tables (duck.external) bring their own location under the sibling
# .../etc/data/duck/external -- not under/above managed storage, so no external
# location needs to be registered.
